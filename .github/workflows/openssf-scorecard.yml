name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 6'  # every Saturday at 08:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # needed to upload SARIF results to GitHub Security tab
      id-token: write          # needed for Scorecard's OIDC token
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
